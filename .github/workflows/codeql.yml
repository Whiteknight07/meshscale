name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '29 6 * * 1'

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    # Code scanning on private repositories needs GitHub Advanced Security.
    if: ${{ !github.event.repository.private }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write # Upload analysis results to code scanning.
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            runner: ubuntu-latest
            build-mode: manual
          - language: javascript-typescript
            runner: ubuntu-latest
            build-mode: none
          - language: swift
            runner: macos-15
            build-mode: manual
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: matrix.language == 'go'
        with:
          go-version-file: go.mod
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Build Go for extraction
        if: matrix.language == 'go'
        run: go build -mod=readonly ./...
      - name: Build Swift for extraction
        if: matrix.language == 'swift'
        run: macos/scripts/swift.sh build
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
