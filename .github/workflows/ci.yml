name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  go:
    name: Go (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: |
          unformatted=$(git ls-files -z '*.go' | xargs -0 gofmt -l)
          if [[ -n "$unformatted" ]]; then
            printf 'Run gofmt on:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Vet Darwin
        env:
          GOOS: darwin
          CGO_ENABLED: '0'
        run: go vet ./...
      # Run as the ordinary hosted-runner user, without credentials or sudo.
      # Privileged, namespace, TUN and live API tests require explicit opt-in.
      - name: Race tests
        run: go test -race -count=1 -timeout 5m ./...

  build:
    name: Cross-build binaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p bin
          GOOS=darwin GOARCH=arm64 go build -mod=readonly -trimpath -buildvcs=false -o bin/meshscale-darwin-arm64 ./cmd/meshscale
          GOOS=linux GOARCH=amd64 go build -mod=readonly -trimpath -buildvcs=false -o bin/meshscale-linux-amd64 ./cmd/meshscale
          GOOS=linux GOARCH=arm64 go build -mod=readonly -trimpath -buildvcs=false -o bin/meshscale-linux-arm64 ./cmd/meshscale
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: meshscale-binaries
          path: bin/meshscale-*
          retention-days: 7
          if-no-files-found: error

  analysis:
    name: Staticcheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
      - name: Staticcheck
        run: staticcheck ./...

  govulncheck:
    name: Go vulnerability check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Govulncheck
        run: govulncheck ./...

  macos:
    name: Swift tests and release build
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Swift version
        id: swift
        run: |
          swift --version
          echo "version=$(swift --version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: macos/.build
          key: swift-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift.outputs.version }}-${{ hashFiles('macos/Package.swift', 'macos/Package.resolved', 'macos/Sources/**', 'macos/Tests/**', 'macos/scripts/swift.sh') }}
          restore-keys: |
            swift-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift.outputs.version }}-
      - name: Swift tests
        run: macos/scripts/swift.sh test
      - name: Build embedded CLI for packaging tests
        env:
          CGO_ENABLED: '0'
          GOOS: darwin
          GOARCH: arm64
        run: go build -mod=readonly -trimpath -buildvcs=false -o "$RUNNER_TEMP/meshscale-darwin-arm64" ./cmd/meshscale
      - name: Test ad-hoc app packaging
        env:
          CLI_BINARY: ${{ runner.temp }}/meshscale-darwin-arm64
        run: python3 macos/scripts/test-build-app.py

  javascript:
    name: JavaScript (${{ matrix.directory }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        directory: [control, app/frontend]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Production dependency audit
        run: npm audit --omit=dev
      - name: Test control
        if: matrix.directory == 'control'
        run: npm test && npm run typecheck
      - name: Build reference frontend
        if: matrix.directory == 'app/frontend'
        run: npm run build

  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          actionlint
      - name: Zizmor
        run: |
          python3 -m venv "$RUNNER_TEMP/zizmor"
          "$RUNNER_TEMP/zizmor/bin/pip" install zizmor==1.16.3
          "$RUNNER_TEMP/zizmor/bin/zizmor" --offline --persona pedantic .github/workflows
