name: Feature request
description: Propose a focused improvement.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and what prevents it today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and alternatives
      description: Include the affected platform and any supported Cloudflare API that could provide the behavior. Do not include credentials or personal account details.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: How to verify success
      description: Describe a concrete acceptance example and any security or migration implications.
