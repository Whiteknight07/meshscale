version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /control
    schedule:
      interval: weekly
    groups:
      control-dependencies:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /app/frontend
    schedule:
      interval: weekly
    groups:
      frontend-dependencies:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
